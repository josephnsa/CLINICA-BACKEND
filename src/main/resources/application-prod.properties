spring.application.name=salud-backend
# Cloud Run inyecta PORT; debe coincidir con --port del deploy
server.port=${PORT:9090}

# Supabase PostgreSQL (Transaction Pooler - port 6543, recomendado para serverless)
spring.datasource.url=jdbc:postgresql://${DB_HOST}:6543/${DB_NAME}?sslmode=require&prepareThreshold=0
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP - reducir pool para no agotar conexiones en Supabase
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=300000

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
# Reintentos al arrancar (Cloud Run + Supabase: evita fallo si el pool está momentáneamente lleno)
spring.flyway.connect-retries=10
spring.flyway.connect-retries-interval=5s

app.jwt.secret=${JWT_SECRET}
app.jwt.expiration=3600000
app.jwt.refresh-expiration=604800000

springdoc.swagger-ui.enabled=false
springdoc.api-docs.enabled=false

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

# Google OAuth2 (obligatorio en prod: definir GOOGLE_CLIENT_ID en Cloud Run)
google.oauth2.client-id=${GOOGLE_CLIENT_ID:}

logging.level.com.clinica=INFO
logging.level.org.springframework.security=WARN
