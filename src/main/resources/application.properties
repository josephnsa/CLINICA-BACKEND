# Aplicacion
spring.application.name=salud-backend
server.port=9090

# Base de datos Supabase
spring.datasource.url=jdbc:postgresql://aws-1-sa-east-1.pooler.supabase.com:5432/postgres?sslmode=require
spring.datasource.username=postgres.xwfpcqgfcmawhylmhicv
spring.datasource.password=lOSABEMOAS12
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Flyway (ejecuta V1-V4 al arrancar; para BD limpia ejecutar antes: db/scripts/reset_schema.sql)
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# JWT
app.jwt.secret=3cfa76ef14937c1c0ea519f8fc057a80fcd04a7e3d01d59c0dc8b9d1c5f0e3a1
app.jwt.expiration=3600000
app.jwt.refresh-expiration=604800000

# Swagger (springdoc 2: UI en /swagger-ui.html o /swagger-ui/index.html)
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.url=/api-docs
springdoc.swagger-ui.enabled=true

# CORS
app.cors.allowed-origins=http://localhost:4200

# Logging
logging.level.com.clinica=DEBUG
logging.level.org.springframework.security=DEBUG

# Email (SMTP) — configurar MAIL_USERNAME y MAIL_PASSWORD como variables de entorno
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
app.mail.from=${MAIL_FROM:notificaciones@clinica.pe}
app.reminders.enabled=${REMINDERS_ENABLED:false}

