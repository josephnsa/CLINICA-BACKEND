# Aplicacion — sin secretos en el repo. Ver comentarios abajo.
spring.application.name=salud-backend
server.port=9090

# Base de datos Supabase (Transaction pooler)
# Contraseña: NO la pongas aquí. IntelliJ → Run → Environment variables:
#   SPRING_DATASOURCE_PASSWORD=tu_password_de_supabase
# Cloud Run: Secret Manager → secreto DB_PASSWORD (mismo valor que en Supabase).
spring.datasource.url=jdbc:postgresql://aws-1-sa-east-1.pooler.supabase.com:6543/postgres?sslmode=require&prepareThreshold=0
spring.datasource.username=postgres.xwfpcqgfcmawhylmhicv
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# JWT — mínimo 32 bytes. Ej.: openssl rand -hex 32
# IntelliJ: APP_JWT_SECRET=<hex de 64 chars>
app.jwt.secret=${APP_JWT_SECRET:}
app.jwt.expiration=3600000
app.jwt.refresh-expiration=604800000

# Swagger
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.url=/api-docs
springdoc.swagger-ui.enabled=true

# CORS
app.cors.allowed-origins=http://localhost:4200

# Logging
logging.level.com.clinica=DEBUG
logging.level.org.springframework.security=DEBUG

# Email
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
app.mail.from=${MAIL_FROM:notificaciones@clinica.pe}
app.reminders.enabled=${REMINDERS_ENABLED:false}

# Google OAuth2
google.oauth2.client-id=${GOOGLE_CLIENT_ID:}

# SUNAT
sunat.ruc=${EMPRESA_RUC:20000000001}
sunat.pse.url=${SUNAT_PSE_URL:https://api.nubefact.com/api/v1}
sunat.pse.token=${SUNAT_PSE_TOKEN:}
sunat.keystore.path=${KEYSTORE_PATH:}
sunat.keystore.password=${KEYSTORE_PASSWORD:}
